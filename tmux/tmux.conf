# Minimal tmux configuration. Neovim is optional.
set -g prefix C-Space
unbind C-b
set -g mouse on
set -g history-limit 10000
set -g mode-keys vi
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 1
set -g set-titles on
set -g automatic-rename on
set -g automatic-rename-format '#(bash "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/program-name.sh" "#{pane_pid}" "#{pane_current_path}" #{q:pane_title})'
set -g status-style 'bg=colour235,fg=colour255'
set -g status-left-length 40
set -g status-right-length 120
set -g status-left '#[fg=colour232,bg=colour220,bold] #S #[default]'
set -g window-status-format '#[fg=colour255,bg=colour238]#(bash "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/codex-status.sh" "#{pane_id}" "#{pane_pid}" "#{window_active}" "#{window_id}") #W #[default]'
set -g window-status-current-format '#[fg=colour255,bg=colour27,bold]#(bash "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/codex-status.sh" "#{pane_id}" "#{pane_pid}" "#{window_active}" "#{window_id}") #W #[default]'
set -g window-status-separator '│'
set -g status-right '#(bash "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/resource-status.sh")#(bash "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/git-status.sh" "#{pane_current_path}")'

# TPM owns tmux plugin loading. EasyMotion's full chooser stays on M-Space;
# the managed wrapper below gives copy-mode Space the direct bd-w path.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'IngoMeyer441/tmux-easy-motion'
set -g @easy-motion-prefix 'M-Space'
set -g @easy-motion-copy-mode-prefix 'M-Space'
set -g @easy-motion-target-keys 'asdfghjklqwertyuiopzxcvbnm'
set -g @easy-motion-verbose 'false'
set -g @easy-motion-auto-begin-selection "true"
set -g @easy-motion-binding-bd-w 'm'
set -g @easy-motion-binding-bd-W 'M'
set -g @easy-motion-binding-bd-e 'n'
set -g @easy-motion-binding-bd-E 'N'
set -g @easy-motion-binding-bd-j 'o'
set -g @easy-motion-binding-bd-J 'O'
set -g @easy-motion-binding-bd-f2 'p'
set -g @easy-motion-binding-bd-t 'q'
set -g @easy-motion-binding-bd-T 'Q'
run-shell -b 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm/tpm"'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -a -c "#{pane_current_path}"
bind g display-popup -E -w 95% -h 95% -d "#{pane_current_path}" lazygit
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Copy mode uses the platform clipboard when one is available. EasyMotion
# moves the native copy-mode cursor; tmux continues to own the selection.
if-shell "command -v pbcopy >/dev/null 2>&1" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'"
if-shell "command -v pbcopy >/dev/null 2>&1" \
  "bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'"
if-shell "command -v wl-copy >/dev/null 2>&1" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'"
if-shell "command -v xclip >/dev/null 2>&1" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"
if-shell "command -v xsel >/dev/null 2>&1" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xsel --clipboard --input'"

bind -T copy-mode-vi Space run-shell -b 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/easy-motion-default.sh"'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi j send-keys -X cursor-down
bind -T copy-mode-vi k send-keys -X cursor-up
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down
bind -T copy-mode-vi C-b send-keys -X page-up
bind -T copy-mode-vi C-f send-keys -X page-down
bind -T copy-mode-vi / command-prompt -T search -p "(search backward)" { send-keys -X search-backward -- "%%" }
bind -T copy-mode-vi ? command-prompt -T search -p "(search forward)" { send-keys -X search-forward -- "%%" }
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi q send-keys -X cancel
bind [ copy-mode
bind v copy-mode \; run-shell -b 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/easy-motion-default.sh"'
